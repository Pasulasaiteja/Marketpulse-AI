[project]
name = "marketpulse"
version = "0.1.0"
description = "MarketPulse AI: integration layer, Decision API, interface, opportunity discovery"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "MarketPulse-AI-Akhtarali446",
    "marketpluse-ai-M2",
    "marketpulse-ai",
    "Marketpulse-LLM"
]
addopts = "-q"

[tool.ruff]
# Only ever lint the project itself (never the surrounding home directory).
include = ["marketpulse/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
