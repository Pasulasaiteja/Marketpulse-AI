[project]
name = "marketpulse"
version = "0.1.0"
description = "MarketPulse AI: integration layer, Decision API, interface, opportunity discovery"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "src",
    "components/data-layer",
    "components/forecasting",
    "components/optimizer",
    "components/llm"
]
addopts = "-q"

[tool.ruff]
# Only ever lint the project itself (never the surrounding home directory).
include = ["src/marketpulse/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
